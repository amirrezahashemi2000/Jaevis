name: Build Android APK (Jarvis Pro)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'نام برنامه'
        default: 'Jarvis Game'
      app_id:
        description: 'Package ID'
        default: 'com.amir.jarvisgame'
      version_name:
        description: 'ورژن (خالی = 1.0.شماره-بیلد)'
        default: ''
      build_type:
        description: 'نوع بیلد'
        type: choice
        options: [both, debug, release]
        default: both
      build_aab:
        description: 'خروجی AAB برای گوگل پلی'
        type: choice
        options: ['false', 'true']
        default: 'false'
      orientation:
        description: 'جهت صفحه'
        type: choice
        options: [auto, portrait, landscape]
        default: auto
      fullscreen:
        description: 'تمام صفحه (مخفی کردن نوار وضعیت و ناوبری)'
        type: choice
        options: ['true', 'false']
        default: 'true'
      keep_screen_on:
        description: 'روشن ماندن صفحه'
        type: choice
        options: ['true', 'false']
        default: 'true'
      extra_permissions:
        description: 'مجوز میکروفون/دوربین/نوتیفیکیشن'
        type: choice
        options: ['true', 'false']
        default: 'true'
      create_release:
        description: 'ساخت GitHub Release'
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_NAME: ${{ inputs.app_name || 'Jarvis Game' }}
      APP_ID: ${{ inputs.app_id || 'com.amir.jarvisgame' }}
      BUILD_TYPE: ${{ inputs.build_type || 'both' }}
      BUILD_AAB: ${{ inputs.build_aab || 'false' }}
      ORIENTATION: ${{ inputs.orientation || 'auto' }}
      FULLSCREEN: ${{ inputs.fullscreen || 'true' }}
      KEEP_SCREEN_ON: ${{ inputs.keep_screen_on || 'true' }}
      EXTRA_PERMS: ${{ inputs.extra_permissions || 'true' }}
      VERSION_INPUT: ${{ inputs.version_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle & npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: deps-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Compute version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "${VERSION_INPUT:-}" ]; then
            VERSION_NAME="$VERSION_INPUT"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          BASE=$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//; s/-$//')
          [ -z "$BASE" ] && BASE="App"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=${GITHUB_RUN_NUMBER}"
            echo "FILE_BASE=${BASE}-v${VERSION_NAME}"
          } >> "$GITHUB_ENV"

      - name: Prepare web project
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html در ریشه مخزن پیدا نشد"; exit 1; }
          rm -rf build_temp
          mkdir -p build_temp/www
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='build_temp/' \
            --exclude='node_modules/' --exclude='*.md' --exclude='LICENSE' \
            --exclude='icon.png' --exclude='splash.png' \
            ./ build_temp/www/

          # پل نیتیو: window.Native (هپتیک، توست، اشتراک، ذخیره‌سازی، نوتیف، شبکه، دکمه بک ...)
          cat > build_temp/www/native-bridge.js <<'EOF'
          (function () {
            var C = window.Capacitor || {};
            var native = !!(C.isNativePlatform && C.isNativePlatform());
            var P = (native && C.Plugins) || {};
            function safe(fn) { try { return fn(); } catch (e) { console.warn('[Native]', e); } }

            var N = window.Native = {
              isNative: native,
              haptic: function (style) {
                if (P.Haptics) return safe(function () { return P.Haptics.impact({ style: style || 'MEDIUM' }); });
                if (navigator.vibrate) navigator.vibrate(style === 'HEAVY' ? 40 : 15);
              },
              vibrate: function (ms) {
                if (P.Haptics) return safe(function () { return P.Haptics.vibrate({ duration: ms || 200 }); });
                if (navigator.vibrate) navigator.vibrate(ms || 200);
              },
              toast: function (text, long) {
                if (P.Toast) return safe(function () { return P.Toast.show({ text: String(text), duration: long ? 'long' : 'short' }); });
                console.log(text);
              },
              share: function (o) {
                if (P.Share) return P.Share.share(o);
                if (navigator.share) return navigator.share(o);
                return Promise.reject('share unsupported');
              },
              copy: function (t) {
                if (P.Clipboard) return P.Clipboard.write({ string: t });
                return navigator.clipboard.writeText(t);
              },
              set: function (k, v) {
                var s = JSON.stringify(v);
                if (P.Preferences) return P.Preferences.set({ key: k, value: s });
                localStorage.setItem(k, s); return Promise.resolve();
              },
              get: function (k, d) {
                function parse(s) { try { return s == null ? d : JSON.parse(s); } catch (e) { return d; } }
                if (P.Preferences) return P.Preferences.get({ key: k }).then(function (r) { return parse(r.value); });
                return Promise.resolve(parse(localStorage.getItem(k)));
              },
              remove: function (k) {
                if (P.Preferences) return P.Preferences.remove({ key: k });
                localStorage.removeItem(k); return Promise.resolve();
              },
              notify: function (title, body, delayMs) {
                if (!P.LocalNotifications) return Promise.resolve();
                return P.LocalNotifications.requestPermissions().then(function () {
                  return P.LocalNotifications.schedule({ notifications: [{
                    id: Date.now() % 2147483647, title: title, body: body,
                    schedule: { at: new Date(Date.now() + (delayMs || 0) + 250) }
                  }] });
                });
              },
              network: function () {
                return P.Network ? P.Network.getStatus() : Promise.resolve({ connected: navigator.onLine });
              },
              onNetwork: function (cb) {
                if (P.Network) return P.Network.addListener('networkStatusChange', cb);
                window.addEventListener('online', function () { cb({ connected: true }); });
                window.addEventListener('offline', function () { cb({ connected: false }); });
              },
              device: function () {
                return P.Device ? P.Device.getInfo() : Promise.resolve({ platform: 'web', userAgent: navigator.userAgent });
              },
              openUrl: function (url) {
                if (P.Browser) return P.Browser.open({ url: url });
                window.open(url, '_blank');
              },
              exit: function () { if (P.App) P.App.exitApp(); }
            };

            if (!native) return;

            // دکمه بک: اگر window.onNativeBack مقدار true برگرداند یعنی خودت هندل کردی
            if (P.App) {
              P.App.addListener('backButton', function (e) {
                if (typeof window.onNativeBack === 'function' && window.onNativeBack(e) === true) return;
                if (e && e.canGoBack) { history.back(); return; }
                if (window.confirm('خروج از برنامه؟')) P.App.exitApp();
              });
              P.App.addListener('appStateChange', function (s) {
                document.dispatchEvent(new CustomEvent(s.isActive ? 'native:resume' : 'native:pause'));
              });
            }
            if (P.StatusBar) safe(function () { P.StatusBar.setStyle({ style: 'DARK' }); });
            window.addEventListener('load', function () {
              setTimeout(function () { if (P.SplashScreen) P.SplashScreen.hide(); }, 300);
            });
          })();
          EOF

          if ! grep -q 'native-bridge.js' build_temp/www/index.html; then
            if grep -qi '</body>' build_temp/www/index.html; then
              sed -i 's#</body>#<script src="native-bridge.js"></script>\n</body>#I' build_temp/www/index.html
            else
              echo '<script src="native-bridge.js"></script>' >> build_temp/www/index.html
            fi
          fi

      - name: Install Capacitor + plugins
        working-directory: build_temp
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/app@6 @capacitor/haptics@6 @capacitor/status-bar@6 \
            @capacitor/splash-screen@6 @capacitor/keyboard@6 @capacitor/network@6 \
            @capacitor/device@6 @capacitor/share@6 @capacitor/clipboard@6 \
            @capacitor/preferences@6 @capacitor/toast@6 @capacitor/browser@6 \
            @capacitor/filesystem@6 @capacitor/local-notifications@6
          npm install --no-audit --no-fund -D @capacitor/assets@3

          node - <<'JS'
          const fs = require('fs');
          const cfg = {
            appId: process.env.APP_ID,
            appName: process.env.APP_NAME,
            webDir: 'www',
            backgroundColor: '#020b14',
            server: { androidScheme: 'https', cleartext: true },
            android: { allowMixedContent: true, webContentsDebuggingEnabled: false },
            plugins: {
              SplashScreen: {
                launchShowDuration: 1500, launchAutoHide: true,
                backgroundColor: '#020b14', showSpinner: false,
                splashFullScreen: true, splashImmersive: true
              },
              StatusBar: { style: 'DARK', backgroundColor: '#020b14' },
              Keyboard: { resize: 'body' }
            }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          JS

      - name: Add Android platform
        working-directory: build_temp
        run: |
          set -euo pipefail
          npx cap add android

      - name: Generate icon & splash
        working-directory: build_temp
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f ../icon.png ]; then
            cp ../icon.png assets/icon.png
          else
            # آیکون پیش‌فرض: رآکتور آرک‌مانند Jarvis
            convert -size 1024x1024 xc:'#020b14' -fill none -stroke '#00e5ff' \
              -strokewidth 22 -draw 'circle 512,512 512,252' \
              -strokewidth 12 -draw 'circle 512,512 512,342' \
              -fill '#00e5ff' -stroke none -draw 'circle 512,512 512,422' \
              assets/icon.png
          fi
          if [ -f ../splash.png ]; then
            cp ../splash.png assets/splash.png
          else
            convert -size 2732x2732 xc:'#020b14' assets/icon.png -gravity center -composite assets/splash.png
          fi
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#020b14' --iconBackgroundColorDark '#020b14' \
            --splashBackgroundColor '#020b14' --splashBackgroundColorDark '#020b14'

      - name: Patch Android project
        working-directory: build_temp
        run: |
          set -euo pipefail

          # --- AndroidManifest: مجوزها، جهت صفحه، cleartext ---
          python3 - <<'PY'
          import os, re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['INTERNET', 'ACCESS_NETWORK_STATE', 'VIBRATE', 'WAKE_LOCK']
          feats = ''
          if os.environ['EXTRA_PERMS'] == 'true':
              perms += ['RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'CAMERA', 'POST_NOTIFICATIONS']
              feats = ('    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                       '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n')
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if 'android.permission.%s"' % x not in s)
          s = re.sub(r'(\s*)<application', lambda m: '\n' + add + feats + '    <application', s, count=1)
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          o = os.environ['ORIENTATION']
          mode = {'portrait': 'portrait', 'landscape': 'sensorLandscape'}.get(o)
          if mode:
              s = s.replace('<activity', '<activity android:screenOrientation="%s"' % mode, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

          # --- MainActivity: تمام صفحه + روشن ماندن صفحه ---
          JAVA_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$JAVA_DIR"
          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package $APP_ID;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final boolean FULLSCREEN = $FULLSCREEN;
              private static final boolean KEEP_ON = $KEEP_SCREEN_ON;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (KEEP_ON) {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
                  applyImmersive();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersive();
              }

              private void applyImmersive() {
                  if (!FULLSCREEN) return;
                  WindowInsetsControllerCompat c =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          EOF

          # --- ورژن ---
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

          # --- لینت نشکند، بیلد سریع‌تر ---
          cat >> android/app/build.gradle <<'EOF'

          android {
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Sync Capacitor
        working-directory: build_temp
        run: npx cap sync android

      - name: Build with Gradle
        working-directory: build_temp/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          case "$BUILD_TYPE" in
            debug)   TASKS=(assembleDebug) ;;
            release) TASKS=(assembleRelease) ;;
            *)       TASKS=(assembleDebug assembleRelease) ;;
          esac
          if [ "$BUILD_AAB" = "true" ]; then TASKS+=(bundleRelease); fi
          ./gradlew "${TASKS[@]}" --no-daemon --stacktrace

      - name: Collect debug APK
        if: env.BUILD_TYPE != 'release'
        run: |
          mkdir -p dist
          cp build_temp/android/app/build/outputs/apk/debug/app-debug.apk "dist/${FILE_BASE}-debug.apk"

      - name: Sign release APK / AAB
        if: env.BUILD_TYPE != 'debug'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS_SECRET"
            KEYPASS="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD}"
            echo "SIGNING=کلید اختصاصی شما" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets برای امضا تنظیم نشده؛ یک کلید موقت ساخته شد (آپدیت روی نسخه قبلی ممکن نیست)."
            STOREPASS="jarvis-temp-pass"; ALIAS="jarvis"; KEYPASS="$STOREPASS"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=Jarvis, O=Amir, C=IR"
            echo "SIGNING=کلید موقت (CI)" >> "$GITHUB_ENV"
          fi

          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=build_temp/android/app/build/outputs
          "$BT/zipalign" -p -f 4 "$OUT/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" \
            --out "dist/${FILE_BASE}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "dist/${FILE_BASE}-release.apk"

          if [ "$BUILD_AAB" = "true" ]; then
            jarsigner -keystore "$KS" -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "dist/${FILE_BASE}-release.aab" \
              "$OUT/bundle/release/app-release.aab" "$ALIAS"
          fi

      - name: Checksums & summary
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "## 📦 $APP_NAME  v$VERSION_NAME (build #$GITHUB_RUN_NUMBER)"
            echo ""
            echo "- Package: \`$APP_ID\`"
            echo "- Orientation: $ORIENTATION · Fullscreen: $FULLSCREEN · Keep-awake: $KEEP_SCREEN_ON"
            echo "- Signing: ${SIGNING:-debug}"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in *.apk *.aab; do
              [ -f "$f" ] && echo "| $f | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Build-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gradle reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-${{ github.run_number }}
          path: build_temp/android/app/build/reports
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ env.APP_NAME }} v${{ env.VERSION_NAME }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
