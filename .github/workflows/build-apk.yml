   name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          mkdir -p build_temp
          mkdir -p build_temp/www
          cp index.html build_temp/www/
          cd build_temp
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Jarvis Game" "com.amir.jarvisgame" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd build_temp/android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Debug-APK
          path: build_temp/android/app/build/outputs/apk/debug/app-debug.apk
