<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS CORE - v2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #0a0e17; color: #00f3ff; min-height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
        h1 { font-size: 14px; letter-spacing: 1px; color: #fff; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        button, select, input { background: #111b2b; color: #00f3ff; border: 1px solid #00f3ff; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; text-align: center; }
        button:active { background: #00f3ff; color: #000; }
        .editor-box { display: flex; flex-direction: column; margin-bottom: 6px; }
        .editor-label { font-size: 11px; color: #8ab4f8; margin-bottom: 3px; display: flex; justify-content: space-between; }
        textarea { width: 100%; height: 90px; background: #05070a; color: #e0e0e0; border: 1px solid #1e3a5f; border-radius: 6px; padding: 8px; font-size: 12px; resize: none; }
        textarea:focus { border-color: #00f3ff; outline: none; }
        .btn-run { background: linear-gradient(45deg, #0077ff, #00f3ff); color: #000; font-weight: bold; width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .terminal { background: #000; border: 1px solid #1e3a5f; border-radius: 6px; padding: 8px; height: 90px; overflow-y: auto; font-size: 11px; color: #00ff66; }
        .terminal p { margin-bottom: 3px; }
        .terminal .error { color: #ff3333; }
    </style>
</head>
<body>

    <header>
        <h1>JARVIS CORE</h1>
        <span style="font-size: 10px; color: #00ff66;">● ONLINE</span>
    </header>

    <div class="controls">
        <input type="text" id="projName" value="Project_1">
        <button onclick="saveProject()">ذخیره</button>
        <button onclick="exportProject()">خروجی HTML</button>
    </div>

    <div class="editor-box">
        <div class="editor-label"><span>HTML</span></div>
        <textarea id="htmlCode" placeholder="<!-- ساختار HTML -->"></textarea>
    </div>

    <div class="editor-box">
        <div class="editor-label"><span>CSS</span></div>
        <textarea id="cssCode" placeholder="/* استایل‌های CSS */"></textarea>
    </div>

    <div class="editor-box">
        <div class="editor-label"><span>JAVASCRIPT</span></div>
        <textarea id="jsCode" placeholder="// کدهای جاوااسکریپت"></textarea>
    </div>

    <button class="btn-run" onclick="executeProtocol()">اجرای پروتکل (Execute)</button>

    <div class="terminal" id="terminal">
        <p>[سیستم آماده است. گزارش‌ها اینجا ظاهر می‌شوند...]</p>
    </div>

    <script>
        function logToTerminal(text, isError = false) {
            const term = document.getElementById('terminal');
            const p = document.createElement('p');
            if(isError) p.className = 'error';
            p.textContent = `> ${text}`;
            term.appendChild(p);
            term.scrollTop = term.scrollHeight;
        }

        // Catch console errors and logs inside execution
        window.onerror = function(msg, url, line) {
            logToTerminal(`خطا: ${msg} (خط ${line})`, true);
        };

        function executeProtocol() {
            const html = document.getElementById('htmlCode').value;
            const css = document.getElementById('cssCode').value;
            const js = document.getElementById('jsCode').value;

            logToTerminal("در حال اجرای پروتکل...");

            const win = window.open('', '_blank');
            if (!win) {
                logToTerminal("خطا: مرورگر مانع از باز شدن پنجره شد.", true);
                return;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html lang="fa" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    <script>
                        // بازنویسی console.log برای ارسال به ترمینال جارویس
                        const originalLog = console.log;
                        console.log = function(...args) {
                            originalLog.apply(console, args);
                        };
                        try {
                            ${js}
                        } catch(err) {
                            console.error(err);
                        }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
            logToTerminal("پروتکل با موفقیت اجرا شد.");
        }

        function saveProject() {
            const name = document.getElementById('projName').value;
            const data = {
                html: document.getElementById('htmlCode').value,
                css: document.getElementById('cssCode').value,
                js: document.getElementById('jsCode').value
            };
            localStorage.setItem('jarvis_' + name, JSON.stringify(data));
            logToTerminal(`پروژه "${name}" با موفقیت ذخیره شد.`);
        }

        function exportProject() {
            const html = document.getElementById('htmlCode').value;
            const css = document.getElementById('cssCode').value;
            const js = document.getElementById('jsCode').value;

            const fullCode = `<!DOCTYPE html>\n<html lang="fa" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n<script>\n${js}\n<\/script>\n</body>\n</html>`;

            const blob = new Blob([fullCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (document.getElementById('projName').value || 'project') + '.html';
            a.click();
            logToTerminal("فایل خروجی HTML ساخته و دانلود شد.");
        }
    </script>
</body>
</html>
