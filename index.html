<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS CORE</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b1528;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.35);
      --text: #e2e8f0;
      --text-dim: #64748b;
      --border: #1e293b;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .brand-subtitle {
      font-size: 0.65rem;
      color: var(--text-dim);
      display: block;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .manager-bar {
      display: flex;
      gap: 8px;
    }
    select, input, button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    select { flex: 1.2; }
    input { flex: 1; text-align: left; direction: ltr; }
    .btn-save {
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .editor-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .editor-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    textarea {
      width: 100%;
      height: 95px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 8px;
      resize: vertical;
      direction: ltr;
      white-space: pre;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .btn-execute {
      background: var(--accent);
      color: #030712;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 15px var(--accent-glow);
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-execute:active {
      transform: scale(0.98);
    }
    .terminal-log {
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      direction: ltr;
      min-height: 24px;
    }
    .terminal-log.success { color: var(--success); }
    .terminal-log.error { color: #f43f5e; }
  </style>
</head>
<body>

  <header>
    <div>
      <span class="brand-title">JARVIS CORE</span>
      <span class="brand-subtitle">WEB RUNNER & PROTOCOL BUILDER</span>
    </div>
    <div class="pulse-dot"></div>
  </header>

  <div class="manager-bar">
    <select id="projectSelect">
      <option value="">-- پروژه‌ها --</option>
    </select>
    <input type="text" id="projectName" placeholder="نام پروژه" value="Project_1">
    <button class="btn-save" id="btnSave">💾 ذخیره</button>
  </div>

  <div class="editor-card">
    <div class="editor-label">HTML</div>
    <textarea id="htmlCode" placeholder="<!-- ساختار HTML -->"></textarea>
  </div>

  <div class="editor-card">
    <div class="editor-label">CSS</div>
    <textarea id="cssCode" placeholder="/* استایل‌های CSS */"></textarea>
  </div>

  <div class="editor-card">
    <div class="editor-label">JavaScript</div>
    <textarea id="jsCode" placeholder="// کدهای اسکریپت JS"></textarea>
  </div>

  <button class="btn-execute" id="btnRun">اجرای پروتکل (Execute)</button>

  <div class="terminal-log" id="terminalLog">[آماده دریافت و اجرای دستورات...]</div>

  <script>
    const htmlIn = document.getElementById('htmlCode');
    const cssIn = document.getElementById('cssCode');
    const jsIn = document.getElementById('jsCode');
    const nameIn = document.getElementById('projectName');
    const selectProj = document.getElementById('projectSelect');
    const logBox = document.getElementById('terminalLog');

    function log(msg, type = '') {
      logBox.className = 'terminal-log ' + type;
      logBox.innerText = `[${new Date().toLocaleTimeString('fa-IR')}] ${msg}`;
    }

    // لود لیست پروژه‌ها از حافظه مرورگر
    function refreshProjectsList() {
      selectProj.innerHTML = '<option value="">-- پروژه‌ها --</option>';
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('jarvis_')) {
          const opt = document.createElement('option');
          const pName = key.replace('jarvis_', '');
          opt.value = pName;
          opt.innerText = pName;
          selectProj.appendChild(opt);
        }
      }
    }

    // دکمه ذخیره
    document.getElementById('btnSave').addEventListener('click', () => {
      const pName = nameIn.value.trim();
      if (!pName) {
        log('خطا: نام پروژه را وارد کنید', 'error');
        return;
      }
      const data = {
        html: htmlIn.value,
        css: cssIn.value,
        js: jsIn.value
      };
      localStorage.setItem('jarvis_' + pName, JSON.stringify(data));
      refreshProjectsList();
      selectProj.value = pName;
      log(`پروژه ${pName} ذخیره شد.`, 'success');
    });

    // جابجایی بین پروژه‌ها
    selectProj.addEventListener('change', () => {
      const selected = selectProj.value;
      if (!selected) return;
      const raw = localStorage.getItem('jarvis_' + selected);
      if (raw) {
        const data = JSON.parse(raw);
        htmlIn.value = data.html || '';
        cssIn.value = data.css || '';
        jsIn.value = data.js || '';
        nameIn.value = selected;
        log(`پروژه ${selected} بارگذاری شد.`, 'success');
      }
    });

    // دکمه اجرای پروتکل
    document.getElementById('btnRun').addEventListener('click', () => {
      try {
        const combined = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>${cssIn.value}</style>
</head>
<body>
  ${htmlIn.value}
  <script>
    try {
      ${jsIn.value}
    } catch(err) {
      alert("خطای جاوااسکریپت: " + err.message);
    }
  <\/script>
</body>
</html>`;

        const blob = new Blob([combined], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        log('پروتکل با موفقیت کامپایل و اجرا شد.', 'success');
      } catch (err) {
        log('خطا در اجرا: ' + err.message, 'error');
      }
    });

    // لود اولیه
    refreshProjectsList();
  </script>
</body>
</html>
